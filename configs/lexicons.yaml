# NER / 槽位推断 共用词库
version: "1.0"
date: "2026-09-22"
note: 词库为种子版（弱标注用），生产需接证券主数据 + 行业分类映射表离线词典

# 时间表达式（NER TIME 标注 + time_anchor 槽位推断共用）
time_expressions:
  absolute:
    - "\\d{4}年(\\d{1,2}月)?(\\d{1,2}日)?"
    - "\\d{1,2}月\\d{1,2}日"
    - "20\\d{2}[-/.]\\d{1,2}([-/.]\\d{1,2})?"
    - "20\\d{2} ?q[1-4]"
    - "(19|20)\\d{2}\\s*(年度|年份)"
  relative_latest: ["最新", "最近", "近期", "今天", "今日", "当前", "目前", "现在", "刚刚", "本周", "本月", "latest", "recent", "today", "now", "this week", "this month", "this quarter"]
  relative_past:   ["昨天", "昨日", "上周", "上月", "上季度", "去年", "上半年", "下半年", "历史", "previous", "last week", "last month", "last year", "yesterday", "past"]
  relative_future: ["明天", "明日", "后天", "下周", "下月", "下季度", "明年", "未来", "接下来", "即将", "tomorrow", "next week", "next month", "next year", "future", "upcoming"]
  range_markers:   ["从.{2,14}到.{2,14}", "至今", "以来", "\\d{4}年至\\d{4}年", "\\d{4}年\\d{1,2}月至今"]

# 指数
index_names: ["上证指数", "深证成指", "创业板指", "科创板", "北证50", "沪深300", "沪深300指数", "中证500", "中证1000", "中证2000", "上证50", "红利指数", "万得全A", "恒生指数", "恒生科技", "纳斯达克", "道琼斯", "标普500", "标普", "日经225", "国证", "中证", "国证价值", "申万"]

# 基金/ETF 关键词
